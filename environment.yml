# Spatial_MAS: Spatial reasoning evaluation (3DSRBench, CV-Bench, GQA)
# Conda env for local setup; run on JupyterHub H100 with same deps
name: spatial_mas
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - torchvision
  # cudatoolkit: Linux 전용이라 macOS에서는 제외. H100 서버에서는 시스템 CUDA 사용하거나
  #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121 로 추가 설치
  - pip:
    # Data & eval
    - datasets
    - huggingface_hub
    - accelerate
    # Qwen2.5-VL
    - transformers>=4.51.0
    - qwen-vl-utils
    # LLaVA (transformers compatible)
    - pillow
    # GPT evaluation
    - openai>=1.0.0
    # Utils
    - tqdm
    - pyyaml
    - pandas
    - numpy
    - jupyter
    - ipykernel
