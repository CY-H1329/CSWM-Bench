# Spatial_MAS evaluation config
# Override on H100: set CUDA_VISIBLE_DEVICES, model paths, GEMINI_API_KEY

dataset:
  name: "OX-PIXL/STVQA-7K"  # or hunarbatra/STVQA-7K
  split: "val"               # val (692) for quick eval; "train" for full 6895
  max_samples: null          # null = all; set e.g. 100 for debugging
  max_per_category: 7       # 카테고리별 샘플 수 (빠른 테스트용). 9카테고리×7=63개

eval:
  batch_size: 1              # VLM inference usually 1
  temperature: 0.0           # greedy decoding (paper setting). 단일 에이전트용.
  multi_agent_temperature: 0.4  # 멀티(3 agents)에서만 사용.
  collab_temperature: 0.4   # 협업(discuss) 모드에서 Qwen/LLaVA 답 다양화. >0 이면 top_k/top_p 적용.
  top_k: 50                 # temperature>0 일 때 sampling
  top_p: 0.9                # nucleus sampling
  max_new_tokens: 512

models:
  qwen:
    enabled: true
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"  # or Qwen2.5-VL-3B-Instruct
    device: "cuda"
  llava:
    enabled: true
    # LLaVA-1.6 (NeXT): 1.5보다 고해상도·추론/OCR 강화. 1.5로 돌리려면 llava-hf/llava-1.5-7b-hf
    model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
    device: "cuda"
  gemini:
    enabled: true
    model_id: "gemini-2.0-flash"   # or gemini-2.5-flash, gemini-1.5-flash
    api_key_env: "GEMINI_API_KEY"  # or GOOGLE_API_KEY
  gpt:
    enabled: false
    model_id: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"

output:
  dir: "results"
  save_predictions: true
  per_category_accuracy: true
