# 3DSRBench API models — 100 samples, separate from existing GPU eval
# API keys: OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY

dataset:
  name: "ccvl/3DSRBench"
  subset: "benchmark"
  split: "test"
  max_samples: 100
  seed: 42

models:
  claude_sonnet_4_5:
    enabled: true
    model_id: "claude-sonnet-4-5-20250929"  # Claude 3.5 Sonnet (20241022) retiré le 2026-01-05
    api_key_env: "ANTHROPIC_API_KEY"
  gpt4o:
    enabled: true
    model_id: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
  deepseek_vl:
    enabled: false  # API officielle sans vision ; retiré
    model_id: "deepseek-vl"
    api_key_env: "DEEPSEEK_API_KEY"
    # api.deepseek.com rejette image_url → utilise /v1/vision
    # Si 404 : base_url: "https://openrouter.ai/api/v1", model_id: "deepseek/deepseek-vl-7b-chat", api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://api.deepseek.com"
  gemini_robotics_er:
    enabled: true
    model_id: "gemini-2.0-flash"  # or gemini-robotics-er when available
    api_key_env: "GEMINI_API_KEY"

output:
  dir: "results"
