# Spatial MAS Pipeline — Head (GPT-5.2), 3 Specialists, Reasoning (DeepSeek-VL)
# Agent names must match configs/mas/agent_profiles/*.json

head_agent:
  model_id: "gpt-4o"  # or gpt-5.2 when available
  api_key_env: "OPENAI_API_KEY"

reasoning_agent:
  runner: "gpu"  # open-source DeepSeek-VL on GPU (no API key)
  model_id: "deepseek-community/deepseek-vl-7b-chat"
  device: "cuda"

# Specialists: GPU (H100) or API. GPU takes precedence when CUDA available.
specialists:
  qwen3_4b:
    runner: "gpu"  # Qwen3Runner on H100
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "cuda"
  sa2va:
    runner: "gpu"
    model_id: "ByteDance/Sa2VA-4B"
    device: "cuda"
  llava4d:
    runner: "gpu"
    model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
    device: "cuda"
  claude_sonnet_4_5:
    runner: "api"
    api_runner: "claude"
    model_id: "claude-sonnet-4-5-20250929"
    api_key_env: "ANTHROPIC_API_KEY"
  gpt4o:
    runner: "api"
    api_runner: "openai"
    model_id: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
  gemini_robotics_er:
    runner: "api"
    api_runner: "gemini"
    model_id: "gemini-2.0-flash"
    api_key_env: "GEMINI_API_KEY"

dataset:
  benchmark: "cvbench"
  max_samples: 100
  test_samples: 5
  seed: 42

output:
  dir: "results/runs/mas_pipeline"
