# Spatial MAS — Head-Agent = LLaVA-NeXT-7B (GPU, HuggingFace Transformers)
# mas_pipeline_version: head-llava-next-7b-cvbench-full-hf-2026.04.03
#
# CV-Bench « full » (split HF test ~2638) :
#   python .../run_eval_mas.py --config .../config_mas_head_llava_next.yaml --benchmark cvbench --full_dataset
# Sans --full_dataset : sous-échantillon (max_samples) ou frozen cvbench_400 si présent sur disque.
#
# HF: llava-hf/llava-v1.6-mistral-7b-hf (LLaVA-1.6 / NeXT, 7B, Mistral backbone)
# Alternative Vicuna backbone: llava-hf/llava-v1.6-vicuna-7b-hf
#
# VRAM: Head = LLaVA-1.6-Mistral-7B. llava4d ci-dessous = LLaVA-1.5-7B (autre checkpoint, évite 2× le même fichier).

head_agent:
  runner: "gpu"
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  device: "cuda"

reasoning_agent:
  runner: "gpu"
  model_id: "deepseek-community/deepseek-vl-7b-chat"
  device: "cuda"

specialists:
  qwen3_4b:
    runner: "gpu"
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "cuda"
  sa2va:
    runner: "gpu"
    model_id: "ByteDance/Sa2VA-4B"
    device: "cuda"
  llava4d:
    runner: "gpu"
    model_id: "llava-hf/llava-1.5-7b-hf"
    device: "cuda"
  claude_sonnet_4_5:
    runner: "api"
    api_runner: "claude"
    model_id: "claude-sonnet-4-5-20250929"
    api_key_env: "ANTHROPIC_API_KEY"
  gpt4o:
    runner: "api"
    api_runner: "openai"
    model_id: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
  gemini_robotics_er:
    runner: "api"
    api_runner: "gemini"
    model_id: "gemini-2.0-flash"
    api_key_env: "GEMINI_API_KEY"

dataset:
  benchmark: "cvbench"
  max_samples: 100
  test_samples: 5
  seed: 42

output:
  dir: "results/runs/mas_pipeline"
  # Run full HF CV-Bench : sortie sous results/runs/mas_pipeline/full_cvbench_hf/
