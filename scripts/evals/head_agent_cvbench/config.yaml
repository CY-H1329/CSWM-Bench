# Head-Agent Category Routing — CV-Bench / 3DSRBench
# Head-Agent 후보: GPT-5.2, Claude Opus 4.5, GLM-5 (Perception/Reasoning은 별도)
# API keys: ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY

dataset:
  # --benchmark all (default): cvbench (4 cats) + 3dsrbench (12 cats)
  max_samples: 100    # per benchmark
  seed: 42

models:
  gpt5_2:
    enabled: true
    model_id: "gpt-5.2"
    api_key_env: "OPENAI_API_KEY"
  claude_opus_4_5:
    enabled: true
    model_id: "claude-opus-4-5-20251101"
    api_key_env: "ANTHROPIC_API_KEY"
  glm5:
    enabled: true
    model_id: "z-ai/glm-5"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    # GLM-5: text-only (OpenRouter vision 미지원)

output:
  dir: "results"
